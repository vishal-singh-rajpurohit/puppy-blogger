services:
  mongo:
    image: mongo:7.0
    container_name: puppy-mongo-prod
    restart: always
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - puppy-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: puppy-backend-prod
    restart: always
    environment:
      PORT: 5001
      ATLAS_LINK: mongodb://mongo:27017/${MONGO_DATABASE:-puppy}
      CORS_URL: ${CORS_URL:-http://localhost}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_EXP: ${ACCESS_TOKEN_EXP:-1d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXP: ${REFRESH_TOKEN_EXP:-7d}
      RESET_PASSWORD_SECRET: ${RESET_PASSWORD_SECRET}
      RESET_PASSWORD_EXP: ${RESET_PASSWORD_EXP:-5m}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-Puppy Blogs <onboarding@resend.dev>}
      BASE_URL: ${BASE_URL:-http://localhost}
    env_file:
      - path: .env
        required: false
      - path: ./Backend/.env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - puppy-prod-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-/api/v1}
    container_name: puppy-frontend-prod
    restart: always
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-/api/v1}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
    env_file:
      - path: .env
        required: false
      - path: ./Frontend/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - puppy-prod-network

  nginx:
    image: nginx:alpine
    container_name: puppy-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - puppy-prod-network

  certbot:
    image: certbot/certbot:latest
    container_name: puppy-certbot-prod
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - puppy-prod-network

networks:
  puppy-prod-network:
    driver: bridge

volumes:
  mongo_prod_data:
    driver: local

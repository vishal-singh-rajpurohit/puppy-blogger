name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Job 1: Backend Typecheck & Build
  # ========================================================
  backend-ci:
    name: Backend CI (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package*.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify TypeScript types
        run: npx tsc --noEmit

      - name: Build Backend bundle
        run: npm run build

  # ========================================================
  # Job 2: Frontend Typecheck & Build
  # ========================================================
  frontend-ci:
    name: Frontend CI (Typecheck & Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package*.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify TypeScript types
        run: npx tsc --noEmit

      - name: Build Next.js bundle
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:5001/api/v1"
          AUTH_SECRET: "ci_pipeline_secret_minimum_32_characters_long_abcdef"
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ========================================================
  # Job 3: Docker Verification
  # ========================================================
  docker-verification:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose config & build
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:5001/api/v1"
          AUTH_SECRET: "ci_pipeline_secret_minimum_32_characters_long_abcdef"
        run: |
          docker compose config --quiet
          docker compose build

  # ========================================================
  # Job 4: Automated Deploy to AWS Ubuntu (CD)
  # ========================================================
  deploy-aws:
    name: Deploy to AWS Ubuntu
    runs-on: ubuntu-latest
    needs: [docker-verification]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Check AWS Secrets Availability
        id: check_secrets
        run: |
          if [ -n "${{ secrets.AWS_HOST }}" ] && [ -n "${{ secrets.AWS_SSH_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "AWS credentials found. Proceeding with automated deployment."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "AWS credentials (AWS_HOST, AWS_SSH_KEY) not found in repository secrets."
            echo "Skipping automated deployment step. See Guide.md for setup instructions."
          fi

      - name: Deploy to AWS EC2 via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            echo "==> Deploying Puppy Blogger to AWS Ubuntu <=="
            
            # Navigate to project directory
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/puppy-blogger' }}"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Deploy directory $DEPLOY_DIR does not exist. Please clone the repository first as outlined in Guide.md."
              exit 1
            fi
            
            cd "$DEPLOY_DIR"
            
            echo "==> Pulling latest changes from Git <=="
            git fetch origin main || git fetch origin master
            git reset --hard origin/main || git reset --hard origin/master
            
            echo "==> Building and restarting Docker containers <=="
            docker compose down --remove-orphans
            docker compose up -d --build
            
            echo "==> Cleaning up unused Docker images <=="
            docker image prune -f
            
            echo "==> Verifying container status <=="
            docker compose ps
            
            echo "==> Deployment completed successfully! <=="
